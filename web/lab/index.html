<!doctype html>
<html lang="en-IN">
<head>
<meta charset="utf-8">

<title>Electrical MCQs Lab</title>

<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Nine hands-on experiments that go with the Electrical MCQs explainer videos: resistance, charge, capacitance, magnetism, inductance, light, induction and alternating current.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Sora:wght@300;400;600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}

/* Layout: a rail of nine experiments beside a wide stage (scene, controls, read-outs, quiz); the rail becomes a scrolling strip on phones.
   One committed look, the "Aurora" stage of the videos: deep indigo, pink for voltage, cyan for current. */
:root {
  --bg: #0b0722;
  --bg-2: #120b30;
  --panel: #161038;
  --line: #2c2460;
  --fg: #f1eeff;
  --dim: #a9a2d2;
  --faint: #6f68a0;
  --pink: #ff4fa3;
  --cyan: #35c9ff;
  --sun: #ffd646;
  --mint: #7dffb0;
  --violet: #b78bff;
  --copper: #ffb27a;
  --good: #7dffb0;
  --bad: #ff6b7d;
  --display: 'Sora', 'Segoe UI', system-ui, sans-serif;
  --body: 'Inter', 'Segoe UI', system-ui, sans-serif;
  --mono: 'JetBrains Mono', ui-monospace, 'Cascadia Mono', Consolas, monospace;
  --radius: 14px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background:
    radial-gradient(ellipse 55% 40% at 8% 0%, rgba(0, 220, 200, 0.13), transparent 70%),
    radial-gradient(ellipse 50% 45% at 100% 8%, rgba(214, 60, 255, 0.13), transparent 70%),
    var(--bg);
  color: var(--fg);
  font: 400 15px/1.55 var(--body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 40px;
}
a { color: var(--cyan); }
:focus-visible { outline: 2px solid var(--sun); outline-offset: 2px; }

.appbar { max-width: 1320px; margin: 0 auto; padding-block: 16px 4px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.site-brand { display: flex; align-items: center; gap: 11px; text-decoration: none; color: var(--fg); }
.spark { width: 38px; height: 38px; border-radius: 12px; background: linear-gradient(120deg, #4C9AFF 0%, #A855F7 100%); display: grid; place-items: center; box-shadow: 0 10px 26px -10px rgba(76, 154, 255, 0.9); flex: 0 0 auto; }
.spark svg { width: 20px; height: 20px; }
.site-brand b { font: 700 16px/1.2 'Space Grotesk', var(--display); letter-spacing: -0.01em; display: block; }
.site-brand small { display: block; font-size: 11px; color: var(--faint); margin-top: 1px; }
.topnav { margin-left: auto; display: flex; gap: 7px; flex-wrap: wrap; }
.topnav a { font: 600 12.5px/1 'Space Grotesk', var(--display); color: var(--dim); text-decoration: none; background: rgba(255, 255, 255, 0.075); border: 1px solid rgba(255, 255, 255, 0.10); padding: 8px 14px; border-radius: 99px; }
.topnav a:hover, .topnav a[aria-current="page"] { color: var(--fg); border-color: rgba(255, 255, 255, 0.18); }
.labbar { max-width: 1320px; margin: 0 auto; display: flex; align-items: center; gap: 12px 16px; flex-wrap: wrap; padding-block: 14px 18px; }
.labname { font: 600 22px/1.2 var(--display); letter-spacing: -0.4px; }
.labname span { font: 400 14px/1.3 var(--body); color: var(--dim); letter-spacing: 0; }
.labbar .spacer { flex: 1; }
.score { font: 500 13px/1 var(--mono); color: var(--dim); padding: 8px 12px; border: 1px solid var(--line); border-radius: 999px; }
.score strong { color: var(--sun); font-weight: 500; }
.sub { font: 500 13px/1 var(--body); color: var(--bg); background: var(--cyan); padding: 9px 14px; border-radius: 999px; text-decoration: none; }
.sub:hover { background: var(--fg); }

.wrap { max-width: 1320px; margin: 0 auto; display: grid; grid-template-columns: 270px minmax(0, 1fr); gap: 28px; align-items: start; }

nav.rail { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); display: flex; flex-direction: column; gap: 18px; }
.series h2 { font: 600 11px/1.3 var(--display); letter-spacing: 2.4px; text-transform: uppercase; color: var(--faint); margin: 0 0 6px 10px; }
.series ol { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
.series button {
  width: 100%; display: grid; grid-template-columns: 26px 1fr; gap: 4px 10px; align-items: baseline;
  text-align: left; background: transparent; border: 1px solid transparent; border-radius: 10px;
  color: var(--fg); padding: 8px 10px; cursor: pointer; font: inherit;
}
.series button:hover { background: var(--bg-2); }
.series button[aria-current="true"] { background: var(--panel); border-color: var(--line); }
.series .num { font: 500 12px/1 var(--mono); color: var(--faint); grid-row: span 2; padding-top: 3px; }
.series button[aria-current="true"] .num { color: var(--sun); }
.series .t { font: 400 14px/1.3 var(--display); }
.series .k { font-size: 12px; color: var(--dim); }
.series .done { color: var(--good); font-size: 11px; margin-left: 6px; }

main.stage { min-width: 0; display: flex; flex-direction: column; gap: 18px; }
.head { display: flex; flex-direction: column; gap: 6px; }
.eyebrow { font: 600 11px/1.3 var(--display); letter-spacing: 2.4px; text-transform: uppercase; color: var(--cyan); }
h1 { font: 600 clamp(26px, 3.4vw, 40px)/1.1 var(--display); letter-spacing: -1px; margin: 0; text-wrap: balance; }
.blurb { color: var(--dim); max-width: 68ch; margin: 0; }

.scene { position: relative; border-radius: var(--radius); overflow: hidden; border: 1px solid var(--line);
  background: radial-gradient(ellipse 80% 70% at 50% 40%, #150d3a, #08051a); }
.scene canvas { display: block; width: 100%; aspect-ratio: 16 / 9; touch-action: none; }
.scene .hint { position: absolute; left: 14px; bottom: 10px; font: 400 12px/1.3 var(--body); color: var(--faint); pointer-events: none; }
.scene .pause { position: absolute; right: 10px; top: 10px; background: rgba(11, 7, 34, 0.7); color: var(--dim); border: 1px solid var(--line); border-radius: 999px; font: 500 12px/1 var(--body); padding: 7px 12px; cursor: pointer; }
.scene .pause:hover { color: var(--fg); }

.panel { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 18px; }
.box { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; min-width: 0; }
.box h3 { font: 600 11px/1.3 var(--display); letter-spacing: 2.4px; text-transform: uppercase; color: var(--faint); margin: 0 0 12px; }

.controls { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 14px 20px; }
.ctl { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.ctl .row { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; color: var(--dim); }
.ctl output { font: 500 13px/1.2 var(--mono); color: var(--fg); white-space: nowrap; }
input[type="range"] { width: 100%; accent-color: var(--cyan); height: 22px; }
select { width: 100%; background: var(--bg-2); color: var(--fg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font: inherit; font-size: 14px; }
.check { flex-direction: row; align-items: center; gap: 10px; font-size: 14px; color: var(--fg); cursor: pointer; }
.check input { width: 18px; height: 18px; accent-color: var(--cyan); }
.btn { background: var(--sun); color: #1a1230; border: 0; border-radius: 10px; padding: 11px 16px; font: 600 14px/1 var(--display); cursor: pointer; align-self: start; }
.btn:hover { background: var(--fg); }

.meters { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px 18px; }
.meter { min-width: 0; }
.meter .l { font-size: 12px; color: var(--dim); }
.meter .v { font: 400 22px/1.25 var(--mono); color: var(--fg); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.meter .v small { font-size: 13px; color: var(--dim); margin-left: 4px; }

.quiz { display: flex; flex-direction: column; gap: 16px; }
.q { border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.q legend { font: 400 15px/1.4 var(--display); padding: 0; margin-bottom: 4px; }
.q .opts { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 8px; }
.q .opt { text-align: left; background: var(--bg-2); color: var(--fg); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; font: inherit; font-size: 14px; cursor: pointer; }
.q .opt:hover:not(:disabled) { border-color: var(--cyan); }
.q .opt:disabled { cursor: default; }
.q .opt.right { border-color: var(--good); background: rgba(125, 255, 176, 0.1); }
.q .opt.wrong { border-color: var(--bad); background: rgba(255, 107, 125, 0.1); }
.q .why { font-size: 13px; color: var(--dim); margin: 0; }
.q .why b { color: var(--good); font-weight: 500; }
.q .why b.no { color: var(--bad); }
.foot { display: flex; flex-wrap: wrap; gap: 10px 20px; align-items: center; justify-content: space-between; color: var(--dim); font-size: 13px; }
.foot .watch { font: 600 14px/1 var(--display); color: var(--fg); text-decoration: none; border: 1px solid var(--line); border-radius: 999px; padding: 10px 16px; }
.foot .watch:hover { border-color: var(--pink); }
.foot .nextprev { display: flex; gap: 8px; }
.foot .nextprev button { background: transparent; border: 1px solid var(--line); color: var(--dim); border-radius: 999px; padding: 9px 14px; font: inherit; font-size: 13px; cursor: pointer; }
.foot .nextprev button:hover:not(:disabled) { color: var(--fg); }
.foot .nextprev button:disabled { opacity: 0.35; cursor: default; }

@media (max-width: 980px) {
  .wrap { grid-template-columns: minmax(0, 1fr); }
  nav.rail { position: static; flex-direction: row; overflow-x: auto; gap: 14px; padding-bottom: 6px; scrollbar-width: thin; }
  .series { flex: none; }
  .series ol { flex-direction: row; }
  .series button { width: 200px; }
  .panel { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 560px) {
  .scene canvas { aspect-ratio: 4 / 3; }
  .scene .hint { display: none; }
  .meter .v { font-size: 19px; }
}
</style>
</head>
<body>
<header class="appbar">
  <a class="site-brand" href="/">
    <span class="spark"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L4.5 13.5H11l-1 8.5 8.5-11.5H12z"/></svg></span>
    <span><b>Electrical MCQs</b><small>KPTCL · KPCL · ESCOM — AE &amp; JE prep</small></span>
  </a>
  <nav class="topnav"><a href="/topics/">All topics</a><a href="/guides/">Guides</a><a href="/watch/">Watch</a><a href="/lab/" aria-current="page">Lab</a><a href="/">Practice</a></nav>
</header>
<div class="labbar">
  <div class="labname">Lab <span>· experiments that go with the explainer videos</span></div>
  <div class="spacer"></div>
  <div class="score" id="score" aria-live="polite">Quiz <strong>0</strong> / 27</div>
  <a class="sub" href="https://youtube.com/@electricalmcqs" target="_blank" rel="noopener">Subscribe on YouTube</a>
</div>

<div class="wrap">
  <nav class="rail" id="rail" aria-label="Experiments"></nav>
  <main class="stage">
    <div class="head">
      <div class="eyebrow" id="eyebrow"></div>
      <h1 id="title"></h1>
      <p class="blurb" id="blurb"></p>
    </div>
    <div class="scene">
      <canvas id="cv" role="img" aria-label=""></canvas>
      <div class="hint" id="hint"></div>
      <button class="pause" id="pause" type="button">Pause</button>
    </div>
    <div class="panel">
      <section class="box"><h3>Try it</h3><div class="controls" id="controls"></div></section>
      <section class="box"><h3>Read-outs</h3><div class="meters" id="meters"></div></section>
    </div>
    <section class="box"><h3>Check yourself</h3><div class="quiz" id="quiz"></div></section>
    <div class="foot">
      <a class="watch" id="watch" href="https://youtube.com/@electricalmcqs" target="_blank" rel="noopener">Watch the video</a>
      <div class="nextprev">
        <button type="button" id="prev">Previous</button>
        <button type="button" id="next">Next experiment</button>
      </div>
    </div>
  </main>
</div>

<script>
'use strict';
const TAU = Math.PI * 2;
const COL = { bg: '#0b0722', fg: '#f1eeff', dim: '#a9a2d2', faint: '#6f68a0', line: '#2c2460', pink: '#ff4fa3', cyan: '#35c9ff', sun: '#ffd646', mint: '#7dffb0', violet: '#b78bff', copper: '#ffb27a', white: '#ffffff' };
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

// Engineering notation: returns [number, prefixed unit].
function eng(v, unit, digits = 3) {
  if (!isFinite(v)) return ['∞', unit];
  if (v === 0) return ['0', unit];
  const P = [[1e12, 'T'], [1e9, 'G'], [1e6, 'M'], [1e3, 'k'], [1, ''], [1e-3, 'm'], [1e-6, 'µ'], [1e-9, 'n'], [1e-12, 'p'], [1e-15, 'f']];
  const a = Math.abs(v);
  for (const [sc, p] of P) {
    if (a >= sc * 0.9995) {
      const x = v / sc;
      let s = Math.abs(x) >= Math.pow(10, digits) ? String(Math.round(x)) : x.toPrecision(digits);
      if (s.includes('.') && !s.includes('e')) s = s.replace(/0+$/, '').replace(/\.$/, '');
      return [s, p + unit];
    }
  }
  return [v.toExponential(2), unit];
}
const engs = (v, unit, d) => eng(v, unit, d).join(' ');

// ---------- drawing helpers ----------
function glow(ctx, color, blur) { ctx.shadowColor = color; ctx.shadowBlur = blur; }
function noGlow(ctx) { ctx.shadowBlur = 0; }
function dot(ctx, x, y, r, color, alpha = 1) {
  ctx.globalAlpha = alpha; ctx.fillStyle = color; ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill(); ctx.globalAlpha = 1;
}
function line(ctx, x1, y1, x2, y2, color, width = 2, alpha = 1, dash = null) {
  ctx.globalAlpha = alpha; ctx.strokeStyle = color; ctx.lineWidth = width; ctx.setLineDash(dash || []);
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); ctx.setLineDash([]); ctx.globalAlpha = 1;
}
function arrow(ctx, x1, y1, x2, y2, color, width = 3, head = 10, alpha = 1) {
  const a = Math.atan2(y2 - y1, x2 - x1);
  const len = Math.hypot(x2 - x1, y2 - y1);
  if (len < 2) return;
  const hh = Math.min(head, len * 0.6);
  ctx.globalAlpha = alpha; ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = width; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2 - Math.cos(a) * hh * 0.7, y2 - Math.sin(a) * hh * 0.7); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x2, y2);
  ctx.lineTo(x2 - Math.cos(a - 0.45) * hh, y2 - Math.sin(a - 0.45) * hh);
  ctx.lineTo(x2 - Math.cos(a + 0.45) * hh, y2 - Math.sin(a + 0.45) * hh);
  ctx.closePath(); ctx.fill(); ctx.globalAlpha = 1;
}
function label(ctx, str, x, y, o = {}) {
  ctx.globalAlpha = o.alpha ?? 1;
  ctx.fillStyle = o.color || COL.dim;
  ctx.font = `${o.weight || 400} ${o.size || 13}px ${o.font || "'Inter', system-ui, sans-serif"}`;
  ctx.textAlign = o.align || 'left'; ctx.textBaseline = o.base || 'middle';
  ctx.fillText(str, x, y); ctx.globalAlpha = 1;
}
function plot(ctx, x0, x1, f, color, width = 3, alpha = 1, blur = 12) {
  ctx.globalAlpha = alpha; ctx.strokeStyle = color; ctx.lineWidth = width; ctx.lineJoin = 'round';
  glow(ctx, color, blur);
  ctx.beginPath();
  for (let x = x0; x <= x1; x += 2) { const y = f(x); x === x0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y); }
  ctx.stroke(); noGlow(ctx); ctx.globalAlpha = 1;
}
function roundRect(ctx, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function mix(hexA, hexB, t) {
  const p = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
  const a = p(hexA), b = p(hexB);
  return `rgb(${a.map((v, i) => Math.round(lerp(v, b[i], t))).join(',')})`;
}
function nmToRGB(nm) {
  let r = 0, g = 0, b = 0;
  if (nm < 440) { r = (440 - nm) / 60; b = 1; } else if (nm < 490) { g = (nm - 440) / 50; b = 1; }
  else if (nm < 510) { g = 1; b = (510 - nm) / 20; } else if (nm < 580) { r = (nm - 510) / 70; g = 1; }
  else if (nm < 645) { r = 1; g = (645 - nm) / 65; } else { r = 1; }
  const f = nm < 420 ? 0.4 + 0.6 * (nm - 380) / 40 : nm > 700 ? 0.4 + 0.6 * (780 - nm) / 80 : 1;
  const c = (v) => Math.round(255 * Math.pow(clamp(v * f, 0, 1), 0.8));
  return `rgb(${c(r)},${c(g)},${c(b)})`;
}
function graphAxes(ctx, x0, x1, y, color = COL.line) { line(ctx, x0, y, x1, y, color, 1.5); }

// ---------- 1. resistance ----------
const MAT = {
  copper: { name: 'Copper', rho: 1.68e-8, alpha: 0.00393, n: 8.5e28, color: '#ffb27a' },
  aluminium: { name: 'Aluminium', rho: 2.65e-8, alpha: 0.00429, n: 18.1e28, color: '#cfd8ea' },
  iron: { name: 'Iron', rho: 9.71e-8, alpha: 0.00651, n: 17.0e28, color: '#9aa3b8' },
  nichrome: { name: 'Nichrome', rho: 1.10e-6, alpha: 0.0004, n: 9.0e28, color: '#d7a6ff' },
};
function wireCalc(s) {
  const m = MAT[s.mat];
  const A = Math.PI * Math.pow(s.d * 1e-3 / 2, 2);
  const rho = m.rho * (1 + m.alpha * (s.T - 20));
  const R = rho * s.L / A;
  return { m, A, rho, R, V: s.I * R, P: s.I * s.I * R, drift: s.I / (m.n * A * 1.602e-19) };
}

// ---------- 6. light ----------
const BANDS = [
  [0, 3e9, 'Radio'], [3e9, 3e11, 'Microwaves'], [3e11, 4e14, 'Infrared'], [4e14, 7.9e14, 'Visible light'],
  [7.9e14, 3e16, 'Ultraviolet'], [3e16, 3e19, 'X-rays'], [3e19, Infinity, 'Gamma rays'],
];
const bandOf = (f) => BANDS.find(([a, b]) => f >= a && f < b)[2];
function sizeOf(lam) {
  if (lam >= 1e3) return 'longer than a town';
  if (lam >= 1) return 'the size of a car or a house';
  if (lam >= 1e-2) return 'the size of your hand';
  if (lam >= 1e-4) return 'the size of a pinhead';
  if (lam >= 1e-6) return 'the size of a cell';
  if (lam >= 1e-8) return 'the size of a virus';
  if (lam >= 1e-10) return 'the size of a molecule';
  return 'smaller than an atom';
}

// ---------- the experiments ----------
const LABS = [
  {
    id: 'wire', n: 1, series: 'basics', video: 'Inside the Wire', topic: 'Resistance',
    blurb: 'A current flows through a wire. Change the metal, its length, thickness and temperature, and watch the resistance, the heat and the slow drift of the electrons.',
    hint: 'Electrons (cyan) drift against the conventional current (gold).',
    state: { mat: 'copper', L: 2, d: 0.5, T: 20, I: 2 },
    controls: [
      { type: 'select', key: 'mat', label: 'Metal', options: Object.entries(MAT).map(([k, m]) => [k, m.name]) },
      { type: 'range', key: 'L', label: 'Length', min: 0.5, max: 20, step: 0.5, unit: 'm' },
      { type: 'range', key: 'd', label: 'Diameter', min: 0.2, max: 2.5, step: 0.05, unit: 'mm' },
      { type: 'range', key: 'T', label: 'Temperature', min: -50, max: 300, step: 5, unit: '°C' },
      { type: 'range', key: 'I', label: 'Current', min: 0, max: 10, step: 0.1, unit: 'A' },
    ],
    readouts(s) {
      const c = wireCalc(s);
      return [
        ['Resistance', ...eng(c.R, 'Ω')],
        ['Voltage across the wire', ...eng(c.V, 'V')],
        ['Heat produced', ...eng(c.P, 'W')],
        ['Electron drift speed', (c.drift * 1000).toPrecision(2), 'mm/s'],
      ];
    },
    draw(ctx, w, h, dt, s, t) {
      const c = wireCalc(s);
      const x0 = w * 0.06, x1 = w * 0.94, cy = h * 0.47;
      const th = lerp(20, h * 0.4, (s.d - 0.2) / 2.3);
      const hot = Math.max(clamp(c.P / s.L / 40, 0, 1), clamp((s.T - 120) / 180, 0, 1));
      const body = mix(c.m.color, '#ff7a2e', hot * 0.85);

    quiz: [
      { q: 'A 230 V (RMS) supply reaches a peak of about…', o: ['230 V', '163 V', '325 V', '460 V'], a: 2, why: 'Peak = RMS × √2, and 230 × 1.414 ≈ 325 V.' },
      { q: 'At 50 Hz, one cycle lasts…', o: ['50 ms', '20 ms', '2 ms', '0.5 s'], a: 1, why: 'Period = 1 ÷ frequency = 1 ÷ 50 s = 20 ms.' },
      { q: 'How many times a second does a 50 Hz current change direction?', o: ['25', '50', '100', '200'], a: 2, why: 'It reverses twice in every cycle: 2 × 50 = 100.' },
    ],
  },
  {
    id: 'rlc', n: 9, series: 'ac', video: 'Out of Step', topic: 'R, L and C on alternating current',
    blurb: 'Put a resistor, a coil or a capacitor on a 230 V supply. Change its size and the frequency, and watch the current fall into step, lag or lead.',
    hint: 'Left: the voltage and current as turning arrows. Right: the waves they draw.',
    state: { kind: 'L', R: 50, Lh: 0.1, Cf: 1e-4, f: 50, th: 0 },
    controls: [
      { type: 'select', key: 'kind', label: 'Component', options: [['R', 'Resistor'], ['L', 'Coil'], ['C', 'Capacitor']] },
      { type: 'log', key: 'R', label: 'Resistance', min: 1, max: 1000, unit: 'Ω', show: (s) => s.kind === 'R' },
      { type: 'log', key: 'Lh', label: 'Inductance', min: 1e-3, max: 2, unit: 'H', show: (s) => s.kind === 'L' },
      { type: 'log', key: 'Cf', label: 'Capacitance', min: 1e-6, max: 1e-3, unit: 'F', show: (s) => s.kind === 'C' },
      { type: 'log', key: 'f', label: 'Frequency', min: 1, max: 10000, unit: 'Hz' },
    ],
    calc(s) {
      const X = s.kind === 'R' ? s.R : s.kind === 'L' ? TAU * s.f * s.Lh : 1 / (TAU * s.f * s.Cf);
      const phi = s.kind === 'R' ? 0 : s.kind === 'L' ? Math.PI / 2 : -Math.PI / 2;
      const I = 230 / X;
      return { X, phi, I, P: 230 * I * Math.cos(phi), Q: 230 * I * Math.sin(phi) };
    },
    readouts(s) {
      const c = this.calc(s);
      return [[s.kind === 'R' ? 'Resistance' : 'Reactance', ...eng(c.X, 'Ω')], ['Current (RMS)', ...eng(c.I, 'A')],
        ['Timing', s.kind === 'R' ? 'in step' : s.kind === 'L' ? 'current lags 90°' : 'current leads 90°', ''],
        ['Average power', ...eng(Math.abs(c.P) < 1e-9 ? 0 : c.P, 'W')], ['Power borrowed and returned', ...eng(Math.abs(c.Q), 'VAR')]];
    },
    draw(ctx, w, h, dt, s) {
      if (!reduceMotion) s.th += TAU * 0.4 * dt;
      const c = this.calc(s);
      const pcx = w * 0.15, cy = h * 0.42, r = Math.min(h * 0.28, w * 0.11);
      ctx.strokeStyle = COL.line; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(pcx, cy, r, 0, TAU); ctx.stroke();
      arrow(ctx, pcx, cy, pcx + Math.cos(s.th) * r, cy - Math.sin(s.th) * r, COL.pink, 3.5, 12);
      arrow(ctx, pcx, cy, pcx + Math.cos(s.th - c.phi) * r * 0.72, cy - Math.sin(s.th - c.phi) * r * 0.72, COL.cyan, 3.5, 12);
      label(ctx, 'voltage', pcx, cy + r + 20, { align: 'center', color: COL.pink, size: 12 });
      label(ctx, 'current', pcx, cy + r + 36, { align: 'center', color: COL.cyan, size: 12 });
      const name = { R: 'Resistor', L: 'Coil', C: 'Capacitor' }[s.kind];
      label(ctx, name, pcx, 22, { align: 'center', color: s.kind === 'L' ? COL.copper : s.kind === 'C' ? COL.violet : COL.fg, size: 15, font: "'Sora', sans-serif" });
      const x0 = w * 0.32, x1 = w * 0.96, hv = h * 0.2, cy2 = h * 0.8, hp = h * 0.13;
      const k = (TAU * 2) / (x1 - x0);
      const a = (x) => s.th - (x - x0) * k;
      graphAxes(ctx, x0, x1, cy); graphAxes(ctx, x0, x1, cy2);
      plot(ctx, x0, x1, (x) => cy - hv * Math.sin(a(x)), COL.pink, 3);
      plot(ctx, x0, x1, (x) => cy - hv * 0.72 * Math.sin(a(x) - c.phi), COL.cyan, 3);
      plot(ctx, x0, x1, (x) => cy2 - hp * Math.sin(a(x)) * Math.sin(a(x) - c.phi), COL.sun, 2.6);
      line(ctx, x0, cy2 - hp * 0.5 * Math.cos(c.phi), x1, cy2 - hp * 0.5 * Math.cos(c.phi), COL.sun, 1.4, 0.9, [6, 6]);
      label(ctx, 'power (dashed: its average)', x0, cy2 - hp - 14, { color: COL.sun, size: 12 });
      label(ctx, `${engs(s.f, 'Hz')}, shown slowed down`, x1, h - 16, { align: 'right', color: COL.faint, size: 12 });
    },
    quiz: [
      { q: 'In a pure inductor on AC, the current…', o: ['is in step with the voltage', 'leads the voltage by 90°', 'lags the voltage by 90°', 'is 180° out of step'], a: 2, why: 'The coil’s voltage depends on how fast the current changes, so the current peaks a quarter cycle later.' },
      { q: 'You double the frequency. A capacitor’s reactance…', o: ['doubles', 'halves', 'stays the same', 'drops to zero'], a: 1, why: 'X_C = 1 ÷ (2πfC): it falls as the frequency rises.' },
      { q: 'The average power taken by an ideal coil on AC is…', o: ['V × I', 'I² × X', 'zero', 'the same as a resistor of equal ohms'], a: 2, why: 'It borrows energy for its field and gives it all back each cycle.' },
    ],
  },
];

// ---------- app ----------
const $ = (id) => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d');
let cur = LABS[0], paused = false, last = performance.now(), time = 0;
const store = { get() { try { return JSON.parse(localStorage.getItem('emcq-lab') || '{}'); } catch (e) { return {}; } }, set(v) { try { localStorage.setItem('emcq-lab', JSON.stringify(v)); } catch (e) { /* storage unavailable */ } } };
let answers = store.get();

function buildRail() {
  const groups = [['basics', 'Electricity from the ground up'], ['ac', 'Alternating current']];
  $('rail').innerHTML = groups.map(([g, name]) => `<div class="series"><h2>${name}</h2><ol>${LABS.filter((l) => l.series === g).map((l) =>
    `<li><button type="button" data-id="${l.id}"><span class="num">${String(l.n).padStart(2, '0')}</span><span class="t">${l.video}<span class="done" data-done="${l.id}"></span></span><span class="k">${l.topic}</span></button></li>`).join('')}</ol></div>`).join('');
  $('rail').addEventListener('click', (e) => { const b = e.target.closest('button[data-id]'); if (b) location.hash = b.dataset.id; });
}

function sliderPos(spec, v) { return spec.type === 'log' ? Math.round(1000 * Math.log(v / spec.min) / Math.log(spec.max / spec.min)) : v; }
function sliderVal(spec, p) { return spec.type === 'log' ? spec.min * Math.pow(spec.max / spec.min, p / 1000) : parseFloat(p); }
function fmtVal(spec, v) {
  if (spec.fmt) return spec.fmt(v);
  if (spec.type === 'log') return engs(v, spec.unit, 3);
  const d = (String(spec.step).split('.')[1] || '').length;
  return `${v.toFixed(d)}${spec.unit ? ' ' + spec.unit : ''}`;
}

function buildControls() {
  const box = $('controls'); box.innerHTML = '';
  const s = cur.state;
  cur.controls.forEach((spec, i) => {
    const id = `c-${cur.id}-${i}`;
    const el = document.createElement('div'); el.className = 'ctl'; el.dataset.i = i;
    if (spec.type === 'range' || spec.type === 'log') {
      el.innerHTML = `<div class="row"><label for="${id}">${spec.label}</label><output for="${id}"></output></div><input type="range" id="${id}">`;
      const inp = el.querySelector('input');
      if (spec.type === 'log') { inp.min = 0; inp.max = 1000; inp.step = 1; } else { inp.min = spec.min; inp.max = spec.max; inp.step = spec.step; }
      inp.addEventListener('input', () => { s[spec.key] = sliderVal(spec, inp.value); cur.changed?.(s, spec.key); sync(); });
    } else if (spec.type === 'select') {
      el.innerHTML = `<label for="${id}" class="row">${spec.label}</label><select id="${id}">${spec.options.map(([v, t]) => `<option value="${v}">${t}</option>`).join('')}</select>`;
      el.querySelector('select').addEventListener('change', (e) => { s[spec.key] = e.target.value; cur.changed?.(s, spec.key); sync(); });
    } else if (spec.type === 'toggle') {
      el.className = 'ctl check'; el.innerHTML = `<input type="checkbox" id="${id}"><label for="${id}">${spec.label}</label>`;
      el.querySelector('input').addEventListener('change', (e) => { s[spec.key] = e.target.checked; sync(); });
    } else if (spec.type === 'button') {
      el.innerHTML = `<button type="button" class="btn" id="${id}"></button>`;
      el.querySelector('button').addEventListener('click', () => { spec.action(s); sync(); });
    }
    box.appendChild(el);
  });
  sync();
}
function sync() {
  const s = cur.state;
  cur.controls.forEach((spec, i) => {
    const el = $('controls').querySelector(`[data-i="${i}"]`);
    if (!el) return;
    el.hidden = spec.show ? !spec.show(s) : false;
    if (spec.type === 'range' || spec.type === 'log') { el.querySelector('input').value = sliderPos(spec, s[spec.key]); el.querySelector('output').textContent = fmtVal(spec, s[spec.key]); }
    else if (spec.type === 'select') el.querySelector('select').value = s[spec.key];
    else if (spec.type === 'toggle') el.querySelector('input').checked = !!s[spec.key];
    else if (spec.type === 'button') el.querySelector('button').textContent = spec.label(s);
  });
  updateMeters(true);
}
let meterKey = '';
function updateMeters(force) {
  const rows = cur.readouts(cur.state);
  const key = JSON.stringify(rows);
  if (!force && key === meterKey) return;
  meterKey = key;
  $('meters').innerHTML = rows.map(([l, v, u]) => `<div class="meter"><div class="l">${l}</div><div class="v">${v}${u ? `<small>${u}</small>` : ''}</div></div>`).join('');
}

function buildQuiz() {
  const a = answers[cur.id] || {};
  $('quiz').innerHTML = cur.quiz.map((q, i) => `<fieldset class="q" data-q="${i}"><legend>${i + 1}. ${q.q}</legend><div class="opts">${q.o.map((o, j) =>
    `<button type="button" class="opt" data-j="${j}">${o}</button>`).join('')}</div><p class="why" hidden></p></fieldset>`).join('');
  cur.quiz.forEach((q, i) => { if (a[i] !== undefined) markQuestion(i, a[i]); });
}
function markQuestion(i, j) {
  const q = cur.quiz[i];
  const fs = $('quiz').querySelector(`[data-q="${i}"]`);
  fs.querySelectorAll('.opt').forEach((b) => {
    b.disabled = true;
    const k = +b.dataset.j;
    if (k === q.a) b.classList.add('right'); else if (k === j) b.classList.add('wrong');
  });
  const why = fs.querySelector('.why');
  why.innerHTML = `<b class="${j === q.a ? '' : 'no'}">${j === q.a ? 'Correct.' : 'Not quite.'}</b> ${q.why}`;
  why.hidden = false;
}
$('quiz').addEventListener('click', (e) => {
  const b = e.target.closest('.opt'); if (!b || b.disabled) return;
  const i = +b.closest('.q').dataset.q, j = +b.dataset.j;
  answers[cur.id] = answers[cur.id] || {}; answers[cur.id][i] = j; store.set(answers);
  markQuestion(i, j); updateScore();
});
function updateScore() {
  let right = 0;
  for (const l of LABS) {
    const a = answers[l.id] || {};
    let n = 0;
    l.quiz.forEach((q, i) => { if (a[i] === q.a) { right++; n++; } });
    const d = document.querySelector(`[data-done="${l.id}"]`);
    if (d) d.textContent = Object.keys(a).length === l.quiz.length ? `${n}/3` : '';
  }
  $('score').innerHTML = `Quiz <strong>${right}</strong> / ${LABS.length * 3}`;
}

function show(id) {
  cur = LABS.find((l) => l.id === id) || LABS[0];
  document.querySelectorAll('.series button').forEach((b) => b.setAttribute('aria-current', b.dataset.id === cur.id ? 'true' : 'false'));
  $('eyebrow').textContent = `Video ${cur.n} · ${cur.topic}`;
  $('title').textContent = cur.video;
  $('blurb').textContent = cur.blurb;
  $('hint').textContent = cur.hint || '';
  cv.setAttribute('aria-label', `${cur.video}: interactive scene. ${cur.blurb}`);
  $('watch').href = `https://www.youtube.com/@electricalmcqs/search?query=${encodeURIComponent(cur.video)}`;
  $('watch').textContent = `Watch “${cur.video}” on YouTube`;
  $('prev').disabled = cur.n === 1; $('next').disabled = cur.n === LABS.length;
  document.title = `${cur.video} · Electrical MCQs Lab`;
  buildControls(); buildQuiz(); updateScore();
}
$('prev').addEventListener('click', () => { location.hash = LABS[cur.n - 2].id; });
$('next').addEventListener('click', () => { location.hash = LABS[cur.n].id; window.scrollTo({ top: 0, behavior: reduceMotion ? 'auto' : 'smooth' }); });
$('pause').addEventListener('click', () => { paused = !paused; $('pause').textContent = paused ? 'Play' : 'Pause'; });
window.addEventListener('hashchange', () => show(location.hash.slice(1)));

function local(e) { const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; }
cv.addEventListener('pointerdown', (e) => { if (!cur.pointer) return; const [x, y] = local(e); if (cur.pointer('down', x, y, cur.state, cv.clientWidth, cv.clientHeight)) { cv.setPointerCapture(e.pointerId); e.preventDefault(); } });
cv.addEventListener('pointermove', (e) => { if (!cur.pointer) return; const [x, y] = local(e); cur.pointer(e.buttons ? 'move' : 'hover', x, y, cur.state, cv.clientWidth, cv.clientHeight); });
cv.addEventListener('pointerup', (e) => { if (!cur.pointer) return; const [x, y] = local(e); cur.pointer('up', x, y, cur.state, cv.clientWidth, cv.clientHeight); });

function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  const w = cv.clientWidth, h = cv.clientHeight, dpr = Math.min(2, window.devicePixelRatio || 1);
  if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);
  const step = paused ? 0 : dt;
  time += step;
  try { cur.draw(ctx, w, h, step, cur.state, time); } catch (err) { console.error(err); }
  updateMeters(false);
  requestAnimationFrame(frame);
}

buildRail();
show(location.hash.slice(1) || 'wire');
requestAnimationFrame(frame);
</script>
</body>
</html>
